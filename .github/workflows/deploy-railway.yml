name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths:
      - 'sse-server.mjs'
      - 'bd-worker.mjs'
      - 'bd-mcp-client.mjs'
      - 'bright-data-connector.mjs'
      - 'package*.json'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh || true

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          ~/.railway/bin/railway up \
            --service d4644d02-b55c-4696-b27c-7ea0ac67c66d \
            --environment 86fae840-4cc8-458c-9c32-dd6291bb1c7f \
            --detach
